<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄钟 · Fuo Tools</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101014' stroke='rgba(255,255,255,0.28)' stroke-width='1'/%3E%3Cpath d='M11 23V9h10M11 16h8.5' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#101014" />
  <link rel="manifest" href="../../manifest.json" />
  <!-- 主题：在首帧渲染前同步应用，避免闪色 -->
  <script src="../../assets/js/theme.js?v=4"></script>
  <link rel="stylesheet" href="../../assets/css/style.css?v=5" />
  <link rel="stylesheet" href="../../assets/css/accent.css?v=1" />
  <link rel="stylesheet" href="../assets/office.css?v=1" />
  <link rel="stylesheet" href="assets/pomodoro.css?v=1" />
</head>
<body data-page="office-tool" data-tool="pomodoro" data-zone="office">
  <div class="shell">
    <!-- ===== 侧边栏（共享组件，sidebar.js 填充） ===== -->
    <aside class="sidebar" id="sidebar" data-active="office" data-guard="1" hidden></aside>

    <!-- ===== 主区 ===== -->
    <div class="main-wrap">
      <header class="topbar">
        <nav class="crumbs mono" id="tc-crumb" aria-label="页面路径"></nav>
        <div class="topbar-actions">
          <button class="theme-btn" type="button" data-theme-toggle aria-label="切换亮色 / 暗色模式" title="切换主题">
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
      </header>

      <main class="content of-content">
        <section class="of-hero" data-reveal>
          <p class="of-eyebrow mono">// POMODORO</p>
          <h1>番茄钟</h1>
          <p>专注 25 分钟，休息 5 分钟。统计只保存在本机浏览器，不上传。</p>
        </section>

        <section class="card of-card pm-card" data-reveal>
          <!-- 模式切换 -->
          <div class="pm-modes mono" role="radiogroup" aria-label="模式">
            <button class="pm-mode is-on" data-mode="focus" type="button" role="radio" aria-checked="true" id="pm-mode-focus">专注</button>
            <button class="pm-mode" data-mode="break" type="button" role="radio" aria-checked="false" id="pm-mode-break">休息</button>
          </div>

          <!-- 圆环计时器 -->
          <div class="pm-timer" id="pm-timer" role="timer" aria-live="off">
            <svg viewBox="0 0 200 200" aria-hidden="true">
              <circle class="pm-ring-bg" cx="100" cy="100" r="88" />
              <circle class="pm-ring" id="pm-ring" cx="100" cy="100" r="88" />
            </svg>
            <div class="pm-center">
              <b class="mono" id="pm-time">25:00</b>
              <span class="mono" id="pm-state">准备开始</span>
            </div>
          </div>

          <!-- 控制按钮 -->
          <div class="pm-ctrl">
            <button class="tbtn is-primary" id="pm-start" type="button">▶ 开始</button>
            <button class="tbtn" id="pm-reset" type="button">↺ 重置</button>
            <button class="tbtn" id="pm-skip" type="button" title="跳过当前阶段">⏭ 跳过</button>
          </div>

          <!-- 时长设置 -->
          <div class="pm-opts mono">
            <label>
              <span>专注</span>
              <input type="number" id="pm-len-focus" min="1" max="120" value="25" /> 分钟
            </label>
            <label>
              <span>休息</span>
              <input type="number" id="pm-len-break" min="1" max="60" value="5" /> 分钟
            </label>
            <label class="pm-notify">
              <input type="checkbox" id="pm-notify" />
              <span>桌面通知</span>
            </label>
          </div>
        </section>

        <!-- 今日统计 -->
        <section class="card of-card pm-stats" data-reveal>
          <h2 class="pm-stats-title">今日专注</h2>
          <div class="pm-stats-row">
            <div class="pm-stat"><b class="mono" id="pm-st-count">0</b><span>完成番茄</span></div>
            <div class="pm-stat"><b class="mono" id="pm-st-min">0</b><span>专注分钟</span></div>
            <div class="pm-stat"><b class="mono" id="pm-st-total">0</b><span>累计番茄</span></div>
          </div>
          <p class="pm-stats-hint mono">数据仅保存在本机（fuo-pomo-stats），可随时在设置页清除。</p>
        </section>

        <p class="of-foot mono">番茄钟为纯本地工具 · <a id="pm-back" href="#">返回办公集</a></p>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Supabase SDK：本地打包（登录守卫用），不依赖任何 CDN -->
  <script src="../../assets/vendor/supabase.min.js"></script>
  <script src="../../assets/js/config.js?v=3"></script>
  <script src="../../assets/js/fx.js?v=2"></script>
  <script src="../../assets/js/sidebar.js?v=5"></script>
  <script src="assets/pomodoro.js?v=1"></script>
</body>
</html>
