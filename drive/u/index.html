<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户主页 · Fuo Tools</title>
  <meta name="description" content="Fuo Tools 公开用户主页：简介、加入时间。" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#101014" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101014' stroke='rgba(255,255,255,0.28)' stroke-width='1'/%3E%3Cpath d='M11 23V9h10M11 16h8.5' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="manifest" href="../manifest.json" />
  <!-- 主题：在首帧渲染前同步应用，避免闪色 -->
  <script src="../assets/js/theme.js?v=4"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6" />
  <link rel="stylesheet" href="../assets/css/accent.css?v=1" />
  <style>
    /* ---------- 公开主页专属（/u/?u=<用户名>） ---------- */
    .up-wrap { max-width: 560px; margin: 0 auto; width: 100%; }
    .up-card { padding: 34px 30px; text-align: center; }
    .up-avatar {
      width: 84px; height: 84px; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 24px; font-size: 34px; font-weight: 700;
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.18), rgba(45, 212, 191, 0.05));
      border: 1px solid rgba(45, 212, 191, 0.35);
      color: var(--accent-bright, #2dd4bf);
      user-select: none;
    }
    .up-name {
      font-size: 24px; font-weight: 700; letter-spacing: 0.02em;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      word-break: break-all;
    }
    .up-badge {
      font-size: 10.5px; padding: 3px 8px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18); opacity: 0.75; font-weight: 500;
      flex: none;
    }
    .up-badge.is-banned { border-color: rgba(244, 113, 116, 0.5); color: var(--danger, #f47174); opacity: 1; }
    .up-bio { margin: 14px auto 0; max-width: 40ch; line-height: 1.65; color: var(--text-2, inherit); opacity: 0.9; white-space: pre-wrap; word-break: break-word; }
    .up-bio.is-empty { opacity: 0.45; font-style: italic; }
    .up-meta { margin-top: 22px; display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
    .up-meta > div { display: flex; flex-direction: column; gap: 3px; }
    .up-meta b { font-size: 14px; }
    .up-meta small { font-size: 11px; opacity: 0.6; }
    .up-foot { margin-top: 26px; padding-top: 18px; border-top: 1px dashed rgba(255, 255, 255, 0.12); font-size: 11.5px; opacity: 0.55; }
    .up-miss { text-align: center; padding: 46px 30px; }
    .up-miss h2 { font-size: 20px; margin: 14px 0 8px; }
    .up-miss p { opacity: 0.65; font-size: 13px; line-height: 1.6; }
    .up-miss .mono { margin-top: 18px; font-size: 11.5px; opacity: 0.5; word-break: break-all; }
    .up-loading { text-align: center; padding: 60px 0; opacity: 0.6; font-size: 13px; }
    @media (max-width: 640px) { .up-card { padding: 26px 20px; } }
  </style>
</head>
<body data-page="profile">
  <div class="shell">
    <!-- ===== 侧边栏（共享组件，sidebar.js 填充；公开页不设 data-guard） ===== -->
    <aside class="sidebar" id="sidebar" data-active="" hidden></aside>

    <!-- ===== 主区 ===== -->
    <div class="main-wrap">
      <header class="topbar">
        <nav class="crumbs mono" id="tc-crumb" aria-label="页面路径"></nav>
        <div class="topbar-actions">
          <button class="theme-btn" type="button" data-theme-toggle aria-label="切换亮色 / 暗色模式" title="切换主题">
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <div class="up-wrap" data-reveal id="up-root">
          <div class="up-loading mono" id="up-loading">正在载入…</div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Supabase SDK：profiles 公开可读（RLS profiles_select_all），未登录也能查看 -->
  <script src="../assets/vendor/supabase.min.js"></script>
  <script src="../assets/js/config.js?v=4"></script>
  <script src="../assets/js/fx.js?v=2"></script>
  <script src="../assets/js/sidebar.js?v=6"></script>
  <script>
  (function () {
    'use strict';

    var CFG = window.FUO_CONFIG;
    var $root = document.getElementById('up-root');

    function esc(s) { return String(s == null ? '' : s); }

    function fmtDate(iso) {
      try {
        return new Date(iso).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
      } catch (e) { return '—'; }
    }
    function days(iso) {
      try { return Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000)); }
      catch (e) { return null; }
    }

    function renderMiss(title, desc, kw) {
      document.title = '用户主页 · Fuo Tools';
      var home = (window.FUO_PATHS && window.FUO_PATHS.DRIVE) || '../index.html';
      $root.innerHTML =
        '<article class="card up-card up-miss">' +
          '<div class="up-avatar" style="opacity:.5">?</div>' +
          '<h2></h2><p></p>' +
          (kw ? '<p class="mono"></p>' : '') +
          '<p style="margin-top:20px"><a href="' + home + '">← 返回工作台</a></p>' +
        '</article>';
      $root.querySelector('h2').textContent = title;
      $root.querySelector('p').textContent = desc;
      if (kw) $root.querySelector('.mono:last-of-type').textContent = '// /u/?u=' + kw;
    }

    function renderProfile(p) {
      var name = esc(p.username || '用户');
      var bio = (p.bio != null && String(p.bio).length) ? String(p.bio) : '';
      var banned = p.status === 'banned';
      var d = days(p.created_at);
      document.title = name + ' · Fuo Tools';

      $root.innerHTML =
        '<article class="card up-card">' +
          '<div class="up-avatar" aria-hidden="true"></div>' +
          '<h1 class="up-name"><span id="up-name"></span>' +
            '<span class="up-badge' + (banned ? ' is-banned' : '') + '" id="up-badge"></span>' +
          '</h1>' +
          (bio !== '' ? '<p class="up-bio" id="up-bio"></p>'
                      : '<p class="up-bio is-empty" id="up-bio">这个人还没有写简介…</p>') +
          '<div class="up-meta mono">' +
            '<div><b id="up-joined"></b><small>加入于</small></div>' +
            (d != null ? '<div><b>' + d + '</b><small>在站天数</small></div>' : '') +
          '</div>' +
          '<p class="up-foot mono">Fuo Tools · 公开主页 · 仅展示用户名 / 简介 / 加入时间</p>' +
        '</article>';

      $root.querySelector('.up-avatar').textContent = (name[0] || 'F').toUpperCase();
      $root.querySelector('#up-name').textContent = name;
      $root.querySelector('#up-badge').textContent = banned ? '已封禁' : 'Fuo Tools 用户';
      if (bio !== '') $root.querySelector('#up-bio').textContent = bio;
      $root.querySelector('#up-joined').textContent = fmtDate(p.created_at);
    }

    function load() {
      var u = '';
      try {
        u = (new URLSearchParams(window.location.search).get('u') || '').trim().slice(0, 20);
      } catch (e) {
        var m = window.location.search.match(/[?&]u=([^&]*)/);
        u = m ? decodeURIComponent(m[1]).trim().slice(0, 20) : '';
      }
      if (!u) {
        renderMiss('缺少用户名', '链接格式应为 /u/?u=用户名（在设置页可以复制你的主页链接）。', '');
        return;
      }
      if (!window.supabase || !CFG || !CFG.SUPABASE_URL) {
        renderMiss('无法加载数据', 'SDK 未就绪，请稍后刷新重试。', u);
        return;
      }
      var c;
      try { c = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); }
      catch (e) { renderMiss('无法加载数据', 'Supabase 客户端初始化失败。', u); return; }

      // v0.7 表带 bio；旧表 PGRST204 → 降级查询
      c.from('profiles')
        .select('username,bio,created_at,status')
        .eq('username', u)
        .maybeSingle()
        .then(function (r) {
          if (r.error && (r.error.code === 'PGRST204' || r.error.code === '42703' ||
              /could not find the column|does not exist/i.test(r.error.message || ''))) {
            return c.from('profiles').select('username,created_at,status')
              .eq('username', u).maybeSingle()
              .then(function (r2) {
                if (r2.error || !r2.data) return renderMiss('没有找到该用户', '用户名可能不存在或已更改。', u);
                renderProfile(r2.data);
              });
          }
          if (r.error) return renderMiss('加载失败', r.error.message || '请稍后重试。', u);
          if (!r.data) return renderMiss('没有找到该用户', '用户名可能不存在或已更改。', u);
          renderProfile(r.data);
        });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', load);
    } else {
      load();
    }
  })();
  </script>
</body>
</html>
