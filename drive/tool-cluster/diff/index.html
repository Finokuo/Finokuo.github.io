<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文本 Diff · Fuo Tools</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101014' stroke='rgba(255,255,255,0.28)' stroke-width='1'/%3E%3Cpath d='M11 23V9h10M11 16h8.5' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <!-- 主题：在首帧渲染前同步应用，避免闪色 -->
  <script src="../../assets/js/theme.js?v=2"></script>
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/tool.css" />
</head>
<body data-tool="diff">
  <!-- ===== 顶栏 ===== -->
  <header class="tc-top">
    <div class="tc-top-inner">
      <a class="brand" id="back-cluster" href="#" aria-label="返回工具集">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">工具集</span>
      </a>
      <span class="tc-crumb mono" id="tc-crumb">/ drive / tool-cluster / diff</span>
      <button class="theme-btn" type="button" data-theme-toggle aria-label="切换亮色 / 暗色模式" title="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== 工具主体 ===== -->
  <main class="tc-main">
    <div class="tc-tool-wrap" data-reveal>
      <section class="tc-tool-head">
        <i class="t-ic tc-tool-ic tone-rose" id="tool-icon" aria-hidden="true"></i>
        <div>
          <h1 id="tool-title">文本 Diff</h1>
          <p class="mono" id="tool-desc">逐行对比两段文本，绿增红删</p>
        </div>
      </section>
      <article class="card tc-tool-card">
        <!-- 工具界面由 ../assets/js/tool-page.js 渲染 -->
        <div class="tool-body" id="tool-body"></div>
      </article>
      <p class="tc-foot mono">本地运行 · 输入不出本机 · <a id="tc-back" href="#">返回工具集</a></p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Supabase SDK：本地打包（登录守卫用），不依赖任何 CDN -->
  <script src="../../assets/vendor/supabase.min.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/fx.js"></script>
  <script src="../assets/js/tool-page.js"></script>
</body>
</html>
