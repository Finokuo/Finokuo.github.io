<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密钥中心 - Fuo Studio</title>
<style>
:root{
  --bg-0:#0d1117;
  --bg-1:#161b22;
  --bg-2:#21262d;
  --bg-3:#30363d;
  --border:#30363d;
  --text:#e6edf3;
  --text-dim:#8b949e;
  --text-faint:#6e7681;
  --accent:#58a6ff;
  --success:#238636;
  --success-hover:#2ea043;
  --danger:#da3633;
  --danger-hover:#f85149;
  --warning:#d29922;
  --shadow:0 8px 32px rgba(0,0,0,.4);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;background:var(--bg-0);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer}

.wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(88,166,255,.1), transparent 70%);
}
.container{
  width:100%;max-width:520px;background:var(--bg-1);
  border:1px solid var(--border);border-radius:12px;
  padding:32px 28px;box-shadow:var(--shadow);
}
h1{
  font-size:22px;font-weight:700;text-align:center;margin-bottom:6px;
  background:linear-gradient(180deg, #fff 0%, #adbac7 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.subtitle{
  text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:24px;
}

.tip{
  text-align:center;color:var(--text-dim);line-height:1.7;margin-bottom:18px;
}
.tip.success{color:var(--success)}
.tip.warning{color:var(--warning)}

input{
  width:100%;padding:10px 14px;background:var(--bg-0);
  border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-size:14px;outline:none;margin-bottom:12px;
}
input:focus{border-color:var(--accent)}

.btn{
  width:100%;padding:10px;border-radius:6px;font-size:14px;
  font-weight:500;cursor:pointer;border:none;transition:background .15s;
}
.btn-primary{background:var(--success);color:#fff}
.btn-primary:hover{background:var(--success-hover)}
.btn-secondary{
  background:var(--bg-2);color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{background:var(--bg-3)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-hover)}

.msg{
  font-size:12px;min-height:18px;margin:6px 0 14px;text-align:center;
}
.msg.error{color:var(--danger)}
.msg.success{color:var(--success)}

.section{
  margin-top:24px;padding-top:20px;border-top:1px solid var(--border);
}
.section h3{
  font-size:15px;font-weight:600;margin-bottom:12px;
}
.section-desc{
  font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.6;
}

.input-row{
  display:flex;gap:8px;margin-bottom:12px;
}
.input-row input{flex:1;margin:0}
.input-row button{width:auto;padding:0 16px;flex-shrink:0}

.item-list{display:flex;flex-direction:column;gap:6px}
.item{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--bg-0);
  border:1px solid var(--border);border-radius:6px;
  font-size:13px;font-family:ui-monospace,Consolas,monospace;
}
.item .item-actions{display:flex;gap:6px}
.item button{
  padding:3px 8px;border-radius:4px;background:var(--bg-2);
  color:var(--text-dim);font-size:12px;border:1px solid var(--border);
}
.item button:hover{color:var(--text);border-color:var(--bg-3)}
.item button.danger:hover{
  background:var(--danger);color:#fff;border-color:transparent;
}

.empty{
  text-align:center;color:var(--text-faint);padding:14px;
  font-size:13px;border:1px dashed var(--border);border-radius:6px;
}

.back-link{
  display:block;text-align:center;margin-top:22px;
  color:var(--accent);font-size:13px;
}
.back-link:hover{text-decoration:underline}

.admin-badge{
  display:inline-block;padding:2px 8px;background:var(--warning);
  color:#000;font-size:11px;border-radius:4px;font-weight:600;
  margin-left:6px;vertical-align:middle;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="container">
    <h1>🔑 密钥中心</h1>
    <p class="subtitle">Fuo Studio 注册与验证管理</p>
    <div id="content"></div>
    <a href="../" class="back-link">← 返回主页</a>
  </div>
</div>

<script>
// ========== 数据初始化 ==========
function initStorage(){
  // 初始化用户列表 - 强制包含 System 管理员账号
  if(!localStorage.getItem('fd_users')){
    const defaultUsers = [
      {username:'System', password:'m859203#', isAdmin:true}
    ];
    localStorage.setItem('fd_users', JSON.stringify(defaultUsers));
  } else {
    // 校验并修复：确保 System 账号一定存在
    const users = JSON.parse(localStorage.getItem('fd_users')||'[]');
    const hasSystem = users.some(u=>u.username==='System');
    if(!hasSystem){
      users.unshift({username:'System', password:'m859203#', isAdmin:true});
      localStorage.setItem('fd_users', JSON.stringify(users));
    }
  }

  // 初始化验证密码库
  if(!localStorage.getItem('fd_verifyPasswords')){
    localStorage.setItem('fd_verifyPasswords', JSON.stringify([]));
  }
  // 初始化注册密钥库
  if(!localStorage.getItem('fd_registerKeys')){
    localStorage.setItem('fd_registerKeys', JSON.stringify([]));
  }
}
initStorage();

// 获取当前登录用户
function getCurrentUser(){
  const u = localStorage.getItem('fd_currentUser');
  if(!u) return null;
  const users = JSON.parse(localStorage.getItem('fd_users')||'[]');
  return users.find(x=>x.username===u) || null;
}

// ========== 页面渲染 ==========
const content = document.getElementById('content');
const user = getCurrentUser();

// 已登录普通用户
if(user && !user.isAdmin){
  content.innerHTML = `
    <div class="tip success">
      ✅ 您已登录账号 <b>${user.username}</b><br>
      您已经不需要密钥了哦~
    </div>
  `;
}
// 已登录管理员（System）
else if(user && user.isAdmin){
  renderAdminPanel();
}
// 未登录
else {
  renderVerifyForm(false);
}

// ========== 验证密码表单 ==========
function renderVerifyForm(passed){
  if(!passed){
    content.innerHTML = `
      <p class="tip">请输入验证密码</p>
      <input type="password" id="verify-pwd" placeholder="验证密码">
      <div class="msg error" id="verify-msg"></div>
      <button class="btn btn-primary" id="btn-verify">确认</button>
    `;
    
    document.getElementById('btn-verify').addEventListener('click',()=>{
      const pwd = document.getElementById('verify-pwd').value;
      const msg = document.getElementById('verify-msg');
      const passwords = JSON.parse(localStorage.getItem('fd_verifyPasswords')||'[]');
      
      if(!pwd){ msg.textContent='请输入验证密码'; return; }
      if(!passwords.includes(pwd)){ msg.textContent='验证密码错误'; return; }
      
      renderVerifyForm(true);
    });
  } else {
    // 验证通过，显示注册密钥生成
    content.innerHTML = `
      <p class="tip success">✅ 验证通过</p>
      <div class="section">
        <h3>注册密钥</h3>
        <p class="section-desc">每个密钥只能使用一次，注册成功后自动失效</p>
        <button class="btn btn-secondary" id="btn-gen-key">生成随机注册密钥</button>
        <div id="key-result" style="margin-top:14px"></div>
      </div>
    `;
    
    document.getElementById('btn-gen-key').addEventListener('click',()=>{
      const key = Math.random().toString(36).substring(2,10).toUpperCase();
      let keys = JSON.parse(localStorage.getItem('fd_registerKeys')||'[]');
      keys.push({key, used:false, createTime:Date.now()});
      localStorage.setItem('fd_registerKeys', JSON.stringify(keys));
      
      document.getElementById('key-result').innerHTML = `
        <div class="item">
          <span>${key}</span>
          <span style="color:var(--success);font-size:11px;font-weight:600">有效</span>
        </div>
      `;
    });
  }
}

// ========== 管理员面板 ==========
function renderAdminPanel(){
  const passwords = JSON.parse(localStorage.getItem('fd_verifyPasswords')||'[]');
  const keys = JSON.parse(localStorage.getItem('fd_registerKeys')||'[]');
  const validKeys = keys.filter(k=>!k.used);
  
  content.innerHTML = `
    <p class="tip warning">
      ⚙️ 管理员面板 <span class="admin-badge">System</span><br>
      <span style="font-size:12px">管理验证密码与注册密钥</span>
    </p>
    
    <div class="section">
      <h3>验证密码管理</h3>
      <p class="section-desc">验证密码用于进入本页面生成注册密钥</p>
      <div class="input-row">
        <input type="text" id="new-pwd" placeholder="添加新验证密码">
        <button class="btn btn-primary" id="btn-add-pwd">添加</button>
      </div>
      <div id="pwd-list">
        ${passwords.length===0 
          ? '<div class="empty">暂无验证密码</div>' 
          : passwords.map(p=>`
            <div class="item">
              <span>${p}</span>
              <div class="item-actions">
                <button class="danger" data-pwd="${p}">删除</button>
              </div>
            </div>
          `).join('')
        }
      </div>
    </div>
    
    <div class="section">
      <h3>注册密钥管理</h3>
      <p class="section-desc">注册密钥用于新用户注册账号，使用一次后失效</p>
      <button class="btn btn-secondary" id="btn-gen-admin-key" style="margin-bottom:12px;width:auto;padding:8px 16px">生成新密钥</button>
      <div id="key-list">
        ${validKeys.length===0 
          ? '<div class="empty">暂无有效密钥</div>' 
          : validKeys.map(k=>`
            <div class="item">
              <span>${k.key}</span>
              <div class="item-actions">
                <button class="danger" data-key="${k.key}">删除</button>
              </div>
            </div>
          `).join('')
        }
      </div>
    </div>
  `;
  
  // 添加验证密码
  document.getElementById('btn-add-pwd').addEventListener('click',()=>{
    const pwd = document.getElementById('new-pwd').value.trim();
    if(!pwd) return;
    let passwords = JSON.parse(localStorage.getItem('fd_verifyPasswords')||'[]');
    if(passwords.includes(pwd)) return;
    passwords.push(pwd);
    localStorage.setItem('fd_verifyPasswords', JSON.stringify(passwords));
    renderAdminPanel();
  });
  
  // 删除验证密码
  document.querySelectorAll('#pwd-list .danger').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const pwd = btn.dataset.pwd;
      let passwords = JSON.parse(localStorage.getItem('fd_verifyPasswords')||'[]');
      passwords = passwords.filter(p=>p!==pwd);
      localStorage.setItem('fd_verifyPasswords', JSON.stringify(passwords));
      renderAdminPanel();
    });
  });
  
  // 生成密钥
  document.getElementById('btn-gen-admin-key').addEventListener('click',()=>{
    const key = Math.random().toString(36).substring(2,10).toUpperCase();
    let keys = JSON.parse(localStorage.getItem('fd_registerKeys')||'[]');
    keys.push({key, used:false, createTime:Date.now()});
    localStorage.setItem('fd_registerKeys', JSON.stringify(keys));
    renderAdminPanel();
  });
  
  // 删除密钥
  document.querySelectorAll('#key-list .danger').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key = btn.dataset.key;
      let keys = JSON.parse(localStorage.getItem('fd_registerKeys')||'[]');
      keys = keys.filter(k=>k.key!==key);
      localStorage.setItem('fd_registerKeys', JSON.stringify(keys));
      renderAdminPanel();
    });
  });
}
</script>
</body>
</html>
