<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 · Fuo Tools</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101014' stroke='rgba(255,255,255,0.28)' stroke-width='1'/%3E%3Cpath d='M11 23V9h10M11 16h8.5' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <!-- 主题：在首帧渲染前同步应用，避免闪色 -->
  <script src="assets/js/theme.js?v=3"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
</head>
<body>
  <div class="shell">
    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="./" aria-label="Fuo Tools">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="17" height="17" fill="none"><path d="M11 23V9h10M11 16h8.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">Fuo Tools</span>
      </a>

      <nav class="side-nav" aria-label="工作台导航">
        <a class="side-item is-active" href="#" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="13" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="4" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="13" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
          工作台
        </a>
        <a class="side-item" id="nav-tools" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4.5 4.5 0 0 0-6.09 5.9L3 17.8V21h3.2l5.6-5.61a4.5 4.5 0 0 0 5.9-6.09l-2.8 2.8-2.11-.7-.7-2.11 2.61-2.99Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
          工具集 <i class="mono">9 款</i>
        </a>
        <a class="side-item" id="nav-favorites" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 14.3 9.3 19.5 10 15.7 13.6 16.6 19 12 16.4 7.4 19 8.3 13.6 4.5 10 9.7 9.3 12 4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
          收藏 <i class="mono" id="nav-fav-count" hidden></i>
        </a>
        <a class="side-item" id="nav-settings" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          设置
        </a>
      </nav>

      <div class="side-user">
        <span class="avatar" id="user-avatar" aria-hidden="true">F</span>
        <span class="side-user-meta">
          <b id="user-email">未登录</b>
          <small id="user-state" class="mono">—</small>
        </span>
        <button class="side-logout" id="btn-logout" type="button" title="退出登录" aria-label="退出登录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2M10 12h10M17 9l3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </aside>

    <!-- ===== 主区 ===== -->
    <div class="main-wrap">
      <header class="topbar">
        <span class="topbar-date mono" id="topbar-date">—</span>
        <div class="topbar-actions">
          <span class="topbar-search" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            全局搜索 · 即将上线
            <kbd class="mono">⌘K</kbd>
          </span>
          <button class="theme-btn" type="button" data-theme-toggle aria-label="切换亮色 / 暗色模式" title="切换主题">
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
      </header>

      <div class="banner" id="banner" hidden></div>

      <main class="content">
        <!-- 问候 Hero -->
        <section class="hello" aria-labelledby="hello-title" data-reveal>
          <div class="hello-main">
            <h1 id="hello-title">你好</h1>
            <p id="hello-sub" class="mono">今天也要保持专注。</p>
          </div>
          <div class="hello-stats" id="hello-stats">
            <div class="stat"><b class="mono" id="stat-days">–</b><span>加入天数</span></div>
            <div class="stat"><b class="mono" id="stat-notes">–</b><span>云笔记字数</span></div>
            <div class="stat"><b class="mono" id="stat-tools">0</b><span>工具使用次数</span></div>
          </div>
        </section>

        <!-- Widgets -->
        <section class="widgets">
          <!-- 快捷笔记（云同步） -->
          <article class="card card-note" data-reveal>
            <header class="card-head">
              <h2>
                <i class="head-ic tone-teal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h9l4 4v12a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V5.5A1.5 1.5 0 0 1 6.5 4H6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M14.5 4v4.5H19M8.5 13h7M8.5 16.5h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></i>
                快捷笔记
              </h2>
              <span class="chip mono" id="note-status">加载中…</span>
            </header>
            <textarea id="note-input" placeholder="随手记点什么：待办、灵感、常用代码片段…&#10;内容会自动保存到你的云端账号。"></textarea>
            <footer class="card-foot mono">
              <span id="note-count">0 字</span>
              <span>自动保存 · 实时云同步</span>
            </footer>
          </article>

          <!-- 工具快捷入口 -->
          <article class="card card-tools" data-reveal>
            <header class="card-head">
              <h2>
                <i class="head-ic tone-violet" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg></i>
                工具快捷入口
              </h2>
              <span class="chip chip-live mono">8 款可用</span>
            </header>
            <div class="tool-grid" id="tool-grid">
              <a class="tool" href="#" data-tool-link="json" aria-label="打开 JSON 格式化工具"><b class="t-ic tone-teal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></b><span>JSON</span></a>
              <a class="tool" href="#" data-tool-link="color" aria-label="打开颜色工具"><b class="t-ic tone-fuchsia" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5S6 10.2 6 14.2a6 6 0 0 0 12 0C18 10.2 12 3.5 12 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg></b><span>颜色</span></a>
              <a class="tool" href="#" data-tool-link="password" aria-label="打开密码生成器"><b class="t-ic tone-emerald" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M11.5 12H21M18 12v3.2M15 12v2.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></b><span>密码</span></a>
              <a class="tool" href="#" data-tool-link="textstats" aria-label="打开文本统计工具"><b class="t-ic tone-amber" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 6h15M4.5 12h10M4.5 18h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></b><span>文本</span></a>
              <a class="tool" href="#" data-tool-link="timestamp" aria-label="打开时间戳转换工具"><b class="t-ic tone-cyan" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></b><span>时间戳</span></a>
              <a class="tool" href="#" data-tool-link="base64" aria-label="打开 Base64 编解码工具"><b class="t-ic tone-violet" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M9.5 4l-2 16M16.5 4l-2 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></b><span>Base64</span></a>
              <a class="tool" href="#" data-tool-link="uuid" aria-label="打开 UUID 生成器"><b class="t-ic tone-orange" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="8" cy="12" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M13 10h4.5M13 14h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></b><span>UUID</span></a>
              <a class="tool" href="#" data-tool-link="diff" aria-label="打开文本 Diff 工具"><b class="t-ic tone-rose" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 4.5v15M7 12h2.5M15 12h2.5M16.2 9.8v4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></b><span>Diff</span></a>
            </div>
          </article>

          <!-- 最近使用 -->
          <article class="card card-recent" data-reveal>
            <header class="card-head">
              <h2>
                <i class="head-ic tone-amber" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></i>
                最近使用
              </h2>
            </header>
            <ul class="recent-list" id="recent-list">
              <li class="recent-empty">
                <span class="mono" aria-hidden="true">--</span>
                <p>还没有使用记录。<br />上线后的工具会出现在这里。</p>
              </li>
            </ul>
          </article>

          <!-- 账号信息 -->
          <article class="card card-account" data-reveal>
            <header class="card-head">
              <h2>
                <i class="head-ic tone-emerald" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4.5 19.5c1.2-3.2 4-5 7.5-5s6.3 1.8 7.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></i>
                账号
              </h2>
            </header>
            <dl class="account-list mono">
              <div><dt>用户名</dt><dd id="acc-username">—</dd></div>
              <div><dt>邮箱</dt><dd id="acc-email">—</dd></div>
              <div><dt>用户 ID</dt><dd id="acc-uid">—</dd></div>
              <div><dt>注册时间</dt><dd id="acc-created">—</dd></div>
            </dl>
            <div class="account-actions">
              <button class="btn btn-outline btn-block" id="btn-edit-username" type="button">修改用户名</button>
              <button class="btn btn-outline btn-block" id="btn-logout-2" type="button">退出登录</button>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- ===== 修改用户名弹窗 ===== -->
  <div class="modal" id="username-modal" hidden>
    <div class="modal-mask" data-user-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="un-title">
      <div class="modal-head">
        <h2 class="modal-title" id="un-title">修改用户名</h2>
        <button class="modal-close" type="button" data-user-close aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="modal-sub mono">3-20 位 · 字母 / 数字 / 下划线 · 全站唯一</p>
      <div class="tool-body">
        <label class="tf">
          <span class="tf-label mono">新用户名</span>
          <input type="text" id="un-input" class="tf-input" maxlength="20" placeholder="例如 finokuo" autocomplete="username" spellcheck="false" />
        </label>
        <p class="tf-msg" id="un-msg" hidden></p>
        <div class="tbtn-row">
          <button class="tbtn is-primary" id="un-save" type="button">保存</button>
          <button class="tbtn" type="button" data-user-close>取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase SDK：本地打包，不依赖任何 CDN（国内网络友好） -->
  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/fx.js?v=2"></script>
  <script src="assets/js/sidebar.js?v=2"></script>
  <script src="assets/js/app.js?v=2"></script>
</body>
</html>
