<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具集 · Fuo Tools</title>
  <meta name="description" content="Fuo Tools 工具集：JSON、颜色、密码、时间戳等小工具，本地运行，点开即用。" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101014' stroke='rgba(255,255,255,0.28)' stroke-width='1'/%3E%3Cpath d='M11 23V9h10M11 16h8.5' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#101014" />
  <link rel="manifest" href="../manifest.json" />
  <!-- 主题：在首帧渲染前同步应用，避免闪色 -->
  <script src="../assets/js/theme.js?v=4"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5" />
  <link rel="stylesheet" href="../assets/css/accent.css?v=1" />
  <link rel="stylesheet" href="assets/css/tool.css?v=4" />
</head>
<body data-page="cluster">
  <div class="shell">
    <!-- ===== 侧边栏（共享组件，sidebar.js 填充） ===== -->
    <aside class="sidebar" id="sidebar" data-active="tools" data-guard="1" hidden></aside>

    <!-- ===== 主区 ===== -->
    <div class="main-wrap">
      <header class="topbar">
        <nav class="crumbs mono" id="tc-crumb" aria-label="页面路径"></nav>
        <div class="topbar-actions">
          <button class="theme-btn" type="button" data-theme-toggle aria-label="切换亮色 / 暗色模式" title="切换主题">
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <section class="tc-hero" data-reveal>
          <p class="tc-eyebrow mono">// TOOL CLUSTER</p>
          <h1>工具集</h1>
          <p>17 款小工具，全部在浏览器本地运行，输入不出本机。每个工具都有独立页面，点开即用。</p>
        </section>

        <div class="tc-grid" id="tc-grid" aria-label="工具列表">
          <!-- 工具卡片由 assets/js/tool-page.js 渲染 -->
          <noscript><p class="tc-foot">需要启用 JavaScript 才能加载工具列表。</p></noscript>
        </div>

        <p class="tc-foot mono">更多工具随版本上新 · 去办公集看看：<a href="../office/">待办 / 打卡 / 番茄钟 →</a> · <a id="tc-back" href="#">返回工作台</a></p>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Supabase SDK：本地打包（登录守卫用），不依赖任何 CDN -->
  <script src="../assets/vendor/supabase.min.js"></script>
  <script src="../assets/js/config.js?v=3"></script>
  <script src="../assets/js/fx.js?v=2"></script>
  <script src="../assets/js/sidebar.js?v=5"></script>
  <script src="assets/js/tool-page.js?v=4"></script>
</body>
</html>
